<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>지금 열었나요</title>
  <script>/* 화면 디자인: 'brand'(브랜드) 또는 'classic'(기본). 깜빡임 없이 바로 적용 */
    document.documentElement.dataset.theme = (localStorage.getItem('nowopen.theme') === 'classic') ? 'classic' : 'brand';</script>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=1794064522">
</head>
<body>
  <div id="app">
    <header class="appbar">
      <a class="logo" href="#"><span class="head" id="logoHead"></span><b><span>지금</span> <span>열었나요?</span></b></a>
      <span class="live-chip" id="liveChip"></span>
    </header>

    <!-- 지도 홈 -->
    <section id="view-map" class="view active">
      <div class="ticker"><div class="track" id="ticker"></div></div>
      <header class="topbar">
        <input id="search" type="search" placeholder="가게 이름 검색" autocomplete="off">
        <ul id="search-results" class="hidden"></ul>
      </header>
      <div id="map"></div>
      <div class="legend">
        <span><i class="dot s-before"></i>영업 전</span>
        <span><i class="dot s-open"></i>영업 중</span>
        <span><i class="dot s-closed"></i>영업 종료</span>
        <span><i class="dot s-holiday"></i>휴무</span>
        <span><i class="dot s-shut"></i>폐업</span>
        <span><i class="dot s-checking"></i>확인 중</span>
        <span><i class="dot s-unknown"></i>정보 없음</span>
      </div>
      <div id="nearby" class="nearby hidden"></div>
      <button id="locate" class="fab" aria-label="내 위치">📍</button>
      <div id="sheet" class="sheet hidden"></div>
    </section>

    <!-- 내 활동 -->
    <section id="view-me" class="view">
      <header class="page-title"><span>내 활동</span><button id="gear" class="gear" aria-label="설정">⚙️</button></header>
      <div id="me-body"></div>
    </section>

    <section id="detail" class="detail hidden"></section>

    <section id="report" class="detail report hidden"></section>

    <nav class="tabbar">
      <button data-view="view-map" class="active"><span>🗺️</span>지도</button>
      <button data-view="view-me"><span>🏅</span>내 활동</button>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="mascot.js?v=1794064522" charset="utf-8"></script>
  <script src="data.js?v=1794064522" charset="utf-8"></script>
  <script src="app.js?v=1794064522" charset="utf-8"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="ocr.js?v=1794064522" charset="utf-8"></script>
  <script src="blur.js?v=1794064522" charset="utf-8"></script>
  <script src="me.js?v=1794064522" charset="utf-8"></script>
  <script src="report.js?v=1794064522" charset="utf-8"></script>
  <script src="onboard.js?v=1794064522" charset="utf-8"></script>
</body>
</html>
